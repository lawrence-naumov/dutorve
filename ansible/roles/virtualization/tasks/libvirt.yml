---
- name: Add user to virtualization groups
  ansible.builtin.user:
    name: "{{ setup_username }}"
    groups: "{{ virtualization_groups }}"
    append: true

- name: Enable and start libvirt services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ virtualization_services }}"

