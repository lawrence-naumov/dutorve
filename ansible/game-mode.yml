---
- name: Оптимизация сети Fedora для игр
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    mode: "gaming"

    # Для gaming:
    # 2 = disable Wi-Fi power saving
    # 3 = enable Wi-Fi power saving
    wifi_powersave: "{{ '2' if mode == 'gaming' else '3' }}"

  tasks:

    # ------------------------------------------------------------
    # NetworkManager / Wi-Fi
    # ------------------------------------------------------------

    - name: Настройка энергосбережения Wi-Fi
      community.general.ini_file:
        path: /etc/NetworkManager/conf.d/99-gaming-wifi.conf
        section: connection
        option: wifi.powersave
        value: "{{ wifi_powersave }}"
        mode: "0644"
      become: true
      register: nm_wifi

    - name: Отключение рандомизации MAC при Wi-Fi сканировании
      community.general.ini_file:
        path: /etc/NetworkManager/conf.d/99-gaming-wifi.conf
        section: device
        option: wifi.scan-rand-mac-address
        value: "no"
        state: "{{ 'present' if mode == 'gaming' else 'absent' }}"
        mode: "0644"
      become: true
      register: nm_scan

    - name: Перезапуск NetworkManager
      ansible.builtin.systemd:
        name: NetworkManager
        state: restarted
      become: true
      when: nm_wifi.changed or nm_scan.changed

    # ------------------------------------------------------------
    # Kernel modules
    # ------------------------------------------------------------

    - name: Загрузка BBR
      community.general.modprobe:
        name: tcp_bbr
        state: present
      become: true
      when: mode == 'gaming'

    # ------------------------------------------------------------
    # Queue discipline / TCP
    # ------------------------------------------------------------

    - name: Настройка gaming sysctl
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-gaming-network.conf
        mode: "0644"
        content: |
          # Fair Queueing помогает уменьшать очереди пакетов.
          net.core.default_qdisc = fq_codel

          # BBR имеет смысл для TCP-соединений.
          net.ipv4.tcp_congestion_control = bbr
      become: true
      when: mode == 'gaming'
      register: sysctl_gaming

    - name: Удаление gaming sysctl
      ansible.builtin.file:
        path: /etc/sysctl.d/99-gaming-network.conf
        state: absent
      become: true
      when: mode == 'normal'
      register: sysctl_normal

    - name: Применение sysctl
      ansible.builtin.command:
        cmd: sysctl --system
      become: true
      when: >
        (sysctl_gaming is defined and sysctl_gaming.changed) or
        (sysctl_normal is defined and sysctl_normal.changed)
      changed_when: true

    # ------------------------------------------------------------
    # Проверка состояния
    # ------------------------------------------------------------

    - name: Получение активного qdisc
      ansible.builtin.command:
        cmd: sysctl net.core.default_qdisc
      register: qdisc
      changed_when: false

    - name: Получение TCP congestion control
      ansible.builtin.command:
        cmd: sysctl net.ipv4.tcp_congestion_control
      register: tcp_cc
      changed_when: false

    - name: Проверка BBR
      ansible.builtin.command:
        cmd: sysctl net.ipv4.tcp_available_congestion_control
      register: tcp_available_cc
      changed_when: false

    - name: Вывод состояния сети
      ansible.builtin.debug:
        msg:
          - "Режим: {{ mode | upper }}"
          - "{{ qdisc.stdout }}"
          - "{{ tcp_cc.stdout }}"
          - "{{ tcp_available_cc.stdout }}"

    # ------------------------------------------------------------
    # Ping до шлюза
    # ------------------------------------------------------------

    - name: Определение шлюза
      ansible.builtin.set_fact:
        gateway: "{{ ansible_facts['default_ipv4']['gateway'] | default('1.1.1.1') }}"

    - name: Ping до шлюза
      ansible.builtin.command:
        cmd: "ping -c 20 -W 1 {{ gateway }}"
      register: ping_gateway
      changed_when: false

    - name: Вывод ping до шлюза
      ansible.builtin.debug:
        var: ping_gateway.stdout_lines

    # ------------------------------------------------------------
    # Ping наружу
    # ------------------------------------------------------------

    - name: Ping внешнего узла
      ansible.builtin.command:
        cmd: "ping -c 20 -W 2 1.1.1.1"
      register: ping_internet
      changed_when: false

    - name: Вывод ping наружу
      ansible.builtin.debug:
        var: ping_internet.stdout_lines

    # ------------------------------------------------------------
    # Сетевой интерфейс
    # ------------------------------------------------------------

    - name: Определение интерфейса по default route
      ansible.builtin.command:
        cmd: ip route show default
      register: default_route
      changed_when: false

    - name: Информация о сетевом интерфейсе
      ansible.builtin.command:
        cmd: ip -br link
      register: interfaces
      changed_when: false

    - name: Вывод сетевого состояния
      ansible.builtin.debug:
        msg:
          - "Default route: {{ default_route.stdout }}"
          - "Interfaces:"
          - "{{ interfaces.stdout }}"

