---
- name: Ensure CDI directory exists
  ansible.builtin.file:
    path: /etc/cdi
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Generate NVIDIA CDI configuration
  ansible.builtin.command:
    argv:
      - nvidia-ctk
      - cdi
      - generate
      - --output
      - "{{ nvidia_cdi_config }}"
    creates: "{{ nvidia_cdi_config }}"
  become: true

