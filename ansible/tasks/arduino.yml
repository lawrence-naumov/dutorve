---
- name: Create Arduino IDE installation directory
  ansible.builtin.file:
    path: "{{ arduino_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Download and extract Arduino IDE
  ansible.builtin.unarchive:
    src: "{{ arduino_download_url }}"
    dest: "{{ arduino_install_dir }}"
    remote_src: true
    extra_opts:
      - "--strip-components=1"
    creates: "{{ arduino_install_dir }}/arduino-ide"
  become: true

- name: Ensure Arduino installation ownership
  ansible.builtin.file:
    path: "{{ arduino_install_dir }}"
    recurse: true
    owner: root
    group: root
  become: true

- name: Create Arduino IDE symlink
  ansible.builtin.file:
    src: "{{ arduino_install_dir }}/arduino-ide"
    dest: /usr/local/bin/arduino-ide
    state: link
  become: true

- name: Get setup user information
  ansible.builtin.getent:
    database: passwd
    key: "{{ setup_username }}"

- name: Set setup user home
  ansible.builtin.set_fact:
    setup_user_home: "{{ getent_passwd[setup_username][4] }}"

- name: Ensure Arduino configuration directory exists
  ansible.builtin.file:
    path: "{{ setup_user_home }}/.arduinoIDE"
    state: directory
    owner: "{{ setup_username }}"
    group: "{{ setup_username }}"
    mode: "0755"
  become: true

- name: Configure ESP32 Board Manager
  ansible.builtin.copy:
    dest: "{{ setup_user_home }}/.arduinoIDE/arduino-cli.yaml"
    owner: "{{ setup_username }}"
    group: "{{ setup_username }}"
    mode: "0644"
    content: |
      board_manager:
        additional_urls:
          - {{ arduino_esp32_board_manager_url }}
  become: true

- name: Create Arduino desktop entry
  ansible.builtin.copy:
    dest: /usr/share/applications/arduino-ide.desktop
    owner: root
    group: root
    mode: "0644"
    content: |
      [Desktop Entry]
      Type=Application
      Name=Arduino IDE
      GenericName=Arduino IDE
      Comment=Open-source electronics prototyping platform
      Exec=/usr/local/bin/arduino-ide %F
      Icon={{ arduino_install_dir }}/resources/app/lib/backend/resources/arduino.png
      Terminal=false
      Categories=Development;Engineering;
      MimeType=text/x-arduino;
  become: true

